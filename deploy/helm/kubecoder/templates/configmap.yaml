apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubecoder.fullname" . }}
  labels:
    {{- include "kubecoder.labels" . | nindent 4 }}
data:
  KUBECODER_HTTP_ADDRESS: ":8080"
  KUBECODER_HTTP_READ_TIMEOUT: {{ .Values.http.readTimeout | quote }}
  KUBECODER_HTTP_WRITE_TIMEOUT: {{ .Values.http.writeTimeout | quote }}
  KUBECODER_HTTP_IDLE_TIMEOUT: {{ .Values.http.idleTimeout | quote }}
  KUBECODER_HTTP_SHUTDOWN_TIMEOUT: {{ .Values.http.shutdownTimeout | quote }}
  KUBECODER_HTTP_ALLOWED_ORIGINS: {{ join "," .Values.http.allowedOrigins | quote }}
  KUBECODER_DATABASE_MAX_OPEN_CONNS: {{ .Values.database.maxOpenConns | quote }}
  KUBECODER_DATABASE_MAX_IDLE_CONNS: {{ .Values.database.maxIdleConns | quote }}
  KUBECODER_DATABASE_CONN_MAX_LIFETIME: {{ .Values.database.connMaxLifetime | quote }}
  KUBECODER_OIDC_ISSUER: {{ required "oidc.issuer is required" .Values.oidc.issuer | quote }}
  KUBECODER_OIDC_DISCOVERY_URL: {{ .Values.oidc.discoveryURL | quote }}
  KUBECODER_OIDC_AUDIENCE: {{ required "oidc.audience is required" .Values.oidc.audience | quote }}
  KUBECODER_LOG_LEVEL: {{ .Values.log.level | quote }}
  KUBECODER_LOG_FORMAT: {{ .Values.log.format | quote }}
