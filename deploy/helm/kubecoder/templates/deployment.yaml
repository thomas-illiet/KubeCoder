apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubecoder.fullname" . }}
  labels:
    {{- include "kubecoder.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      {{- include "kubecoder.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "kubecoder.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: wait-for-migration
          image: {{ include "kubecoder.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate", "wait", "--version", {{ .Values.migration.expectedVersion | quote }}, "--timeout", {{ .Values.migration.waitTimeout | quote }}]
          envFrom:
            - configMapRef: { name: {{ include "kubecoder.fullname" . }} }
          env:
            - name: KUBECODER_DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubecoder.databaseSecretName" . }}
                  key: {{ ternary .Values.postgresql.auth.dsnKey .Values.externalDatabase.dsnSecretKey .Values.postgresql.enabled }}
            - name: KUBECODER_SECURITY_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubecoder.encryptionSecretName" . }}
                  key: {{ .Values.security.encryptionKeySecretKey }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
      containers:
        - name: api
          image: {{ include "kubecoder.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          envFrom:
            - configMapRef: { name: {{ include "kubecoder.fullname" . }} }
          env:
            - name: KUBECODER_DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubecoder.databaseSecretName" . }}
                  key: {{ ternary .Values.postgresql.auth.dsnKey .Values.externalDatabase.dsnSecretKey .Values.postgresql.enabled }}
            - name: KUBECODER_SECURITY_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubecoder.encryptionSecretName" . }}
                  key: {{ .Values.security.encryptionKeySecretKey }}
          ports:
            - { name: http, containerPort: 8080 }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
