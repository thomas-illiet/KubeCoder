openapi: 3.0.3
info:
  title: KubeCoder API
  version: 0.1.0
  description: KubeCoder control-plane API.
servers:
  - url: /
tags:
  - name: Account
    description: Authenticated user profile.
  - name: Organizations
    description: Organizations accessible to the authenticated user.
  - name: Organization administration
    description: Administrative organization and membership management.
  - name: User administration
    description: Administrative access to provisioned users.
  - name: Agent administration
    description: Platform-managed agent definitions.
  - name: Repositories
    description: Organization repository configuration and public agent catalog.
  - name: Secrets
    description: Read-only organization secret metadata.
  - name: Secret administration
    description: Write-only platform and tenant secret management.
  - name: System
    description: Service health and readiness.
paths:
  /api/v1/users/me:
    get:
      tags: [Account]
      operationId: getCurrentUser
      summary: Return the authenticated application user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/organizations:
    get:
      tags: [Organizations]
      operationId: listUserOrganizations
      summary: List organizations accessible to the authenticated user
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Query' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Accessible organizations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/organizations/{slug}:
    parameters:
      - { $ref: '#/components/parameters/OrganizationSlug' }
    get:
      tags: [Organizations]
      operationId: getUserOrganization
      summary: Return an organization accessible to the authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Accessible organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/organizations/{slug}/preferred:
    parameters:
      - { $ref: '#/components/parameters/OrganizationSlug' }
    put:
      tags: [Organizations]
      operationId: setPreferredOrganization
      summary: Set the authenticated user preferred organization
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Preferred organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/organizations/{slug}/ssh-key:
    parameters:
      - { $ref: '#/components/parameters/OrganizationSlug' }
    get:
      tags: [Organizations]
      operationId: getOrganizationSSHKey
      summary: Return the organization public SSH key
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Organization public SSH key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationSSHKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/organizations/{slug}/ssh-key/regenerate:
    parameters:
      - { $ref: '#/components/parameters/OrganizationSlug' }
    post:
      tags: [Organizations]
      operationId: regenerateOrganizationSSHKey
      summary: Create a missing organization SSH key pair or replace the existing pair
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Generated organization public SSH key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationSSHKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/organizations:
    get:
      tags: [Organization administration]
      operationId: listOrganizations
      summary: List all organizations
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Query' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/OrganizationOrderBy' }
        - { $ref: '#/components/parameters/OrderDirection' }
      responses:
        '200':
          description: Organization page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOrganizationPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Organization administration]
      operationId: createOrganization
      summary: Create an organization
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrganization' }
      responses:
        '201':
          description: Created organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/organizations/{id}:
    parameters:
      - { $ref: '#/components/parameters/OrganizationID' }
    get:
      tags: [Organization administration]
      operationId: getOrganization
      summary: Return an organization for administration
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Organization administration]
      operationId: renameOrganization
      summary: Rename an organization
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 120 }
              additionalProperties: false
      responses:
        '200':
          description: Updated organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Organization administration]
      operationId: deleteOrganization
      summary: Permanently delete an organization
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Organization deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/admin/organizations/{id}/members:
    parameters:
      - { $ref: '#/components/parameters/OrganizationID' }
    get:
      tags: [Organization administration]
      operationId: listOrganizationMembers
      summary: List organization members
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Query' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/MemberOrderBy' }
        - { $ref: '#/components/parameters/OrderDirection' }
      responses:
        '200':
          description: Member page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationMemberPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Organization administration]
      operationId: addOrganizationMember
      summary: Add a provisioned user to an organization
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string, format: uuid }
              additionalProperties: false
      responses:
        '204': { description: Membership created }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/organizations/{id}/members/{userID}:
    parameters:
      - { $ref: '#/components/parameters/OrganizationID' }
      - name: userID
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Organization administration]
      operationId: removeOrganizationMember
      summary: Remove a user from an organization
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Membership removed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/admin/users:
    get:
      tags: [User administration]
      operationId: listProvisionedUsers
      summary: List provisioned users for membership assignment
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Query' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Provisioned user page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/agents:
    get:
      tags: [Agent administration]
      operationId: listAgents
      summary: List full agent definitions
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Query' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
        - { name: active, in: query, schema: { type: boolean } }
      responses:
        '200': { description: Agent page, content: { application/json: { schema: { $ref: '#/components/schemas/AgentPage' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Agent administration]
      operationId: createAgent
      summary: Create an agent definition
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AgentInput' } } } }
      responses:
        '201': { description: Created agent, content: { application/json: { schema: { $ref: '#/components/schemas/Agent' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/agents/{id}:
    parameters: [{ $ref: '#/components/parameters/ResourceID' }]
    get:
      tags: [Agent administration]
      operationId: getAgent
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Agent definition, content: { application/json: { schema: { $ref: '#/components/schemas/Agent' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Agent administration]
      operationId: updateAgent
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AgentInput' } } } }
      responses:
        '200': { description: Updated agent, content: { application/json: { schema: { $ref: '#/components/schemas/Agent' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Agent administration]
      operationId: deleteAgent
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Agent deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/organizations/{slug}/agents:
    parameters: [{ $ref: '#/components/parameters/OrganizationSlug' }]
    get:
      tags: [Repositories]
      operationId: listOrganizationAgents
      summary: List active public agents available to an organization member
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Query' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200': { description: Public agent page, content: { application/json: { schema: { $ref: '#/components/schemas/PublicAgentPage' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/organizations/{slug}/repositories:
    parameters: [{ $ref: '#/components/parameters/OrganizationSlug' }]
    get:
      tags: [Repositories]
      operationId: listRepositories
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Query' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
        - { name: provider, in: query, schema: { $ref: '#/components/schemas/GitProvider' } }
        - { name: configured, in: query, schema: { type: boolean } }
        - { name: agent_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Repository page, content: { application/json: { schema: { $ref: '#/components/schemas/RepositoryPage' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Repositories]
      operationId: createRepository
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RepositoryInput' } } } }
      responses:
        '201': { description: Created repository, content: { application/json: { schema: { $ref: '#/components/schemas/Repository' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/organizations/{slug}/repositories/{id}:
    parameters:
      - { $ref: '#/components/parameters/OrganizationSlug' }
      - { $ref: '#/components/parameters/ResourceID' }
    get:
      tags: [Repositories]
      operationId: getRepository
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Repository, content: { application/json: { schema: { $ref: '#/components/schemas/Repository' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Repositories]
      operationId: updateRepository
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RepositoryInput' } } } }
      responses:
        '200': { description: Updated repository, content: { application/json: { schema: { $ref: '#/components/schemas/Repository' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Repositories]
      operationId: deleteRepository
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Repository deleted }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/organizations/{slug}/secrets:
    parameters: [{ $ref: '#/components/parameters/OrganizationSlug' }]
    get:
      tags: [Secrets]
      operationId: listOrganizationSecrets
      summary: List sanitized secret metadata for an organization member
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Query' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Offset' }, { $ref: '#/components/parameters/OrganizationSecretScopeFilter' }, { $ref: '#/components/parameters/SecretStatusFilter' }, { $ref: '#/components/parameters/SecretSortBy' }, { $ref: '#/components/parameters/SortOrder' }]
      responses:
        '200': { description: Sanitized secret page, content: { application/json: { schema: { $ref: '#/components/schemas/SecretPage' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Secrets]
      operationId: createOrganizationSecret
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SecretInput' } } } }
      responses: { '201': { description: Created tenant secret, content: { application/json: { schema: { $ref: '#/components/schemas/Secret' } } } }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/organizations/{slug}/secrets/targets:
    parameters: [{ $ref: '#/components/parameters/OrganizationSlug' }]
    get: { tags: [Secrets], operationId: listOrganizationSecretTargets, security: [{ bearerAuth: [] }], responses: { '200': { description: Tenant binding targets, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SecretTarget' } } } } }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /api/v1/organizations/{slug}/secrets/{id}/replace:
    parameters: [{ $ref: '#/components/parameters/OrganizationSlug' }, { $ref: '#/components/parameters/ResourceID' }]
    post: { tags: [Secrets], operationId: replaceOrganizationSecretValue, security: [{ bearerAuth: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SecretReplaceInput' } } } }, responses: { '200': { description: Updated tenant secret, content: { application/json: { schema: { $ref: '#/components/schemas/Secret' } } } }, '404': { $ref: '#/components/responses/NotFound' } } }
  /api/v1/organizations/{slug}/secrets/{id}/bindings:
    parameters: [{ $ref: '#/components/parameters/OrganizationSlug' }, { $ref: '#/components/parameters/ResourceID' }]
    post: { tags: [Secrets], operationId: bindOrganizationSecret, security: [{ bearerAuth: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SecretBindingInput' } } } }, responses: { '201': { description: Created tenant binding, content: { application/json: { schema: { $ref: '#/components/schemas/SecretBinding' } } } } } }
  /api/v1/organizations/{slug}/secrets/{id}/bindings/{bindingID}:
    parameters: [{ $ref: '#/components/parameters/OrganizationSlug' }, { $ref: '#/components/parameters/ResourceID' }, { $ref: '#/components/parameters/BindingID' }]
    delete: { tags: [Secrets], operationId: unbindOrganizationSecret, security: [{ bearerAuth: [] }], responses: { '204': { description: Binding removed }, '404': { $ref: '#/components/responses/NotFound' } } }
  /api/v1/admin/secrets:
    get:
      tags: [Secret administration]
      operationId: listPlatformSecrets
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Query' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Offset' }, { $ref: '#/components/parameters/SecretStatusFilter' }, { $ref: '#/components/parameters/SecretSortBy' }, { $ref: '#/components/parameters/SortOrder' }]
      responses:
        '200': { description: Platform secret page, content: { application/json: { schema: { $ref: '#/components/schemas/SecretPage' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Secret administration]
      operationId: createPlatformSecret
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SecretInput' } } } }
      responses:
        '201': { description: Sanitized secret metadata, content: { application/json: { schema: { $ref: '#/components/schemas/Secret' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/secrets/{id}/replace:
    parameters: [{ $ref: '#/components/parameters/ResourceID' }]
    post: { tags: [Secret administration], operationId: replacePlatformSecretValue, security: [{ bearerAuth: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SecretReplaceInput' } } } }, responses: { '200': { description: Updated sanitized metadata, content: { application/json: { schema: { $ref: '#/components/schemas/Secret' } } } }, '404': { $ref: '#/components/responses/NotFound' } } }
  /api/v1/admin/secrets/{id}/bindings:
    parameters: [{ $ref: '#/components/parameters/ResourceID' }]
    post: { tags: [Secret administration], operationId: bindPlatformSecret, security: [{ bearerAuth: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SecretBindingInput' } } } }, responses: { '201': { description: Created binding, content: { application/json: { schema: { $ref: '#/components/schemas/SecretBinding' } } } } } }
  /api/v1/admin/secrets/{id}/bindings/{bindingID}:
    parameters: [{ $ref: '#/components/parameters/ResourceID' }, { $ref: '#/components/parameters/BindingID' }]
    delete: { tags: [Secret administration], operationId: unbindPlatformSecret, security: [{ bearerAuth: [] }], responses: { '204': { description: Binding removed }, '404': { $ref: '#/components/responses/NotFound' } } }
  /api/v1/admin/secrets/targets:
    get: { tags: [Secret administration], operationId: listPlatformSecretTargets, security: [{ bearerAuth: [] }], responses: { '200': { description: Active agent targets, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SecretTarget' } } } } } } }
  /api/v1/admin/organizations/{organizationID}/secrets:
    parameters: [{ $ref: '#/components/parameters/AdminOrganizationID' }]
    get: { tags: [Secret administration], operationId: listAdminOrganizationSecrets, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/Query' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Offset' }, { $ref: '#/components/parameters/SecretScopeFilter' }, { $ref: '#/components/parameters/SecretStatusFilter' }, { $ref: '#/components/parameters/SecretSortBy' }, { $ref: '#/components/parameters/SortOrder' }], responses: { '200': { description: Tenant secret page, content: { application/json: { schema: { $ref: '#/components/schemas/SecretPage' } } } } } }
    post: { tags: [Secret administration], operationId: createAdminOrganizationSecret, security: [{ bearerAuth: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SecretInput' } } } }, responses: { '201': { description: Created sanitized metadata, content: { application/json: { schema: { $ref: '#/components/schemas/Secret' } } } } } }
  /api/v1/admin/organizations/{organizationID}/secrets/{id}/replace:
    parameters: [{ $ref: '#/components/parameters/AdminOrganizationID' }, { $ref: '#/components/parameters/ResourceID' }]
    post: { tags: [Secret administration], operationId: replaceAdminOrganizationSecretValue, security: [{ bearerAuth: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SecretReplaceInput' } } } }, responses: { '200': { description: Updated sanitized metadata, content: { application/json: { schema: { $ref: '#/components/schemas/Secret' } } } } } }
  /api/v1/admin/organizations/{organizationID}/secrets/{id}/bindings:
    parameters: [{ $ref: '#/components/parameters/AdminOrganizationID' }, { $ref: '#/components/parameters/ResourceID' }]
    post: { tags: [Secret administration], operationId: bindAdminOrganizationSecret, security: [{ bearerAuth: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SecretBindingInput' } } } }, responses: { '201': { description: Created binding, content: { application/json: { schema: { $ref: '#/components/schemas/SecretBinding' } } } } } }
  /api/v1/admin/organizations/{organizationID}/secrets/{id}/bindings/{bindingID}:
    parameters: [{ $ref: '#/components/parameters/AdminOrganizationID' }, { $ref: '#/components/parameters/ResourceID' }, { $ref: '#/components/parameters/BindingID' }]
    delete: { tags: [Secret administration], operationId: unbindAdminOrganizationSecret, security: [{ bearerAuth: [] }], responses: { '204': { description: Binding removed } } }
  /api/v1/admin/organizations/{organizationID}/secrets/targets:
    parameters: [{ $ref: '#/components/parameters/AdminOrganizationID' }]
    get: { tags: [Secret administration], operationId: listAdminOrganizationSecretTargets, security: [{ bearerAuth: [] }], responses: { '200': { description: Active agent and tenant repository targets, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SecretTarget' } } } } } } }
  /healthz:
    get:
      tags: [System]
      operationId: health
      responses:
        '200':
          description: Process is alive
  /readyz:
    get:
      tags: [System]
      operationId: readiness
      responses:
        '200':
          description: API is ready
        '503':
          description: API is not ready
components:
  parameters:
    Query:
      name: query
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    OrganizationOrderBy:
      name: order_by
      in: query
      schema: { type: string, enum: [name, created_at, member_count, repository_count], default: name }
    MemberOrderBy:
      name: order_by
      in: query
      schema: { type: string, enum: [display_name, username, email, joined_at], default: display_name }
    OrderDirection:
      name: order_direction
      in: query
      schema: { type: string, enum: [asc, desc], default: asc }
    OrganizationID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrganizationSlug:
      name: slug
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
    ResourceID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AdminOrganizationID:
      name: organizationID
      in: path
      required: true
      schema: { type: string, format: uuid }
    BindingID:
      name: bindingID
      in: path
      required: true
      schema: { type: string, format: uuid }
    SecretScopeFilter:
      name: scope
      in: query
      schema: { type: string, enum: [ORGANIZATION] }
    OrganizationSecretScopeFilter:
      name: scope
      in: query
      schema: { type: string, enum: [PLATFORM, ORGANIZATION] }
    SecretStatusFilter:
      name: status
      in: query
      schema: { type: string, enum: [ACTIVE, EXPIRING_SOON, EXPIRED] }
    SecretSortBy:
      name: sort_by
      in: query
      schema: { type: string, enum: [variable_name, scope, binding_count, value_replaced_at, expires_at, status], default: variable_name }
    SortOrder:
      name: sort_order
      in: query
      schema: { type: string, enum: [asc, desc], default: asc }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      required: [id, subject, username, display_name, email, is_admin, preferred_organization, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        subject: { type: string }
        username: { type: string }
        display_name: { type: string }
        email: { type: string, format: email }
        is_admin: { type: boolean }
        preferred_organization:
          allOf:
            - { $ref: '#/components/schemas/OrganizationSummary' }
          nullable: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OrganizationSummary:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
    Organization:
      allOf:
        - { $ref: '#/components/schemas/OrganizationSummary' }
        - type: object
          required: [created_at, updated_at]
          properties:
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    CreateOrganization:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, maxLength: 120 }
        slug: { type: string, maxLength: 63, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
      additionalProperties: false
    OrganizationPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Organization' }
        total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer }
    OrganizationSSHKey:
      type: object
      description: Public metadata for an organization's encrypted SSH identity. Private key material is never returned.
      required: [public_key, fingerprint, algorithm, created_at, updated_at]
      properties:
        public_key: { type: string, pattern: '^ssh-ed25519 ' }
        fingerprint: { type: string, pattern: '^SHA256:' }
        algorithm: { type: string, enum: [ssh-ed25519] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AdminOrganization:
      allOf:
        - { $ref: '#/components/schemas/Organization' }
        - type: object
          required: [member_count, repository_count]
          properties:
            member_count: { type: integer, format: int64, minimum: 0 }
            repository_count: { type: integer, format: int64, minimum: 0 }
    AdminOrganizationPage:
      type: object
      required: [items, total, limit, offset, repository_total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminOrganization' }
        total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer }
        repository_total: { type: integer, format: int64, minimum: 0 }
    UserPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/User' }
        total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer }
    OrganizationMember:
      allOf:
        - { $ref: '#/components/schemas/User' }
        - type: object
          required: [joined_at]
          properties:
            joined_at: { type: string, format: date-time }
    OrganizationMemberPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OrganizationMember' }
        total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer }
    GitProvider:
      type: string
      enum: [github, gitlab, bitbucket]
    PublicAgent:
      type: object
      required: [id, name, description, capabilities, active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        capabilities: { type: array, items: { type: string } }
        active: { type: boolean }
    AgentInput:
      type: object
      required: [name, description, runtime_adapter, runtime_version, image, provider, model, system_prompt, capabilities, cpu_millis, memory_mb, storage_mb, max_duration_seconds, active]
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        runtime_adapter: { type: string }
        runtime_version: { type: string }
        image: { type: string }
        provider: { type: string }
        model: { type: string }
        system_prompt: { type: string }
        capabilities: { type: array, items: { type: string } }
        cpu_millis: { type: integer, minimum: 1 }
        memory_mb: { type: integer, minimum: 1 }
        storage_mb: { type: integer, minimum: 1 }
        max_duration_seconds: { type: integer, minimum: 1 }
        active: { type: boolean }
      additionalProperties: false
    Agent:
      allOf:
        - { $ref: '#/components/schemas/AgentInput' }
        - type: object
          required: [id, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    AgentPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Agent' } }
        total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer }
    PublicAgentPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PublicAgent' } }
        total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer }
    RepositoryInput:
      type: object
      required: [name, provider, clone_url, default_branch, include_submodules, secret_mode, secret_ids]
      properties:
        name: { type: string, maxLength: 120 }
        provider: { $ref: '#/components/schemas/GitProvider' }
        clone_url: { type: string }
        default_branch: { type: string, maxLength: 255 }
        include_submodules: { type: boolean }
        agent_id: { type: string, format: uuid, nullable: true }
        secret_mode: { type: string, enum: [ALL, SELECTED], default: ALL }
        secret_ids:
          type: array
          items: { type: string, format: uuid }
      additionalProperties: false
    Repository:
      allOf:
        - { $ref: '#/components/schemas/RepositoryInput' }
        - type: object
          required: [id, organization_id, agent, secret_mode, secret_ids, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            organization_id: { type: string, format: uuid }
            agent:
              allOf: [{ $ref: '#/components/schemas/PublicAgent' }]
              nullable: true
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    RepositoryPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Repository' } }
        total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer }
    SecretInput:
      type: object
      description: The value is write-only and never appears in a response.
      required: [scope, variable_name, description, value]
      properties:
        scope: { type: string, enum: [PLATFORM, ORGANIZATION] }
        variable_name: { type: string, pattern: '^[A-Z_][A-Z0-9_]*$', maxLength: 128 }
        description: { type: string, maxLength: 1000 }
        value: { type: string, format: password, writeOnly: true, maxLength: 65536 }
        expires_at: { type: string, format: date-time, nullable: true }
      additionalProperties: false
    SecretReplaceInput:
      type: object
      description: Atomically overwrites and permanently discards the previous value.
      required: [value]
      properties:
        value: { type: string, format: password, writeOnly: true, maxLength: 65536 }
        expires_at: { type: string, format: date-time, nullable: true }
      additionalProperties: false
    SecretBindingInput:
      type: object
      required: [target_type, target_id]
      properties:
        target_type: { type: string, enum: [AGENT] }
        target_id: { type: string, format: uuid }
      additionalProperties: false
    SecretBinding:
      type: object
      required: [id, target_type, target_id, target_name]
      properties:
        id: { type: string, format: uuid }
        target_type: { type: string, enum: [AGENT, REPOSITORY] }
        target_id: { type: string, format: uuid }
        target_name: { type: string }
    SecretTarget:
      type: object
      required: [id, type, name]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [AGENT, REPOSITORY] }
        name: { type: string }
    Secret:
      type: object
      description: Sanitized secret metadata. Protected storage fields are never serialized.
      required: [id, scope, variable_name, description, value_replaced_at, status, bindings, binding_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        scope: { type: string, enum: [PLATFORM, ORGANIZATION] }
        organization_id: { type: string, format: uuid }
        variable_name: { type: string }
        description: { type: string }
        expires_at: { type: string, format: date-time, nullable: true }
        value_replaced_at: { type: string, format: date-time }
        status: { type: string, enum: [ACTIVE, EXPIRING_SOON, EXPIRED] }
        bindings: { type: array, items: { $ref: '#/components/schemas/SecretBinding' } }
        binding_count: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SecretPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Secret' } }
        total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer }
    Problem:
      type: object
      required: [type, title, status, detail, instance, correlation_id]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        correlation_id: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Access forbidden
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Resource conflict
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Authentication required or invalid
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InternalError:
      description: Internal server error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
