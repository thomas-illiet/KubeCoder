http:
  address: :8080
  read_timeout: 10s
  write_timeout: 15s
  idle_timeout: 60s
  shutdown_timeout: 15s
  allowed_origins:
    - http://localhost:5173
database:
  dsn: postgres://kubecoder:kubecoder@localhost:5432/kubecoder?sslmode=disable
  max_open_conns: 20
  max_idle_conns: 5
  conn_max_lifetime: 30m
oidc:
  issuer: http://localhost:30080/realms/kubecoder
  discovery_url: ""
  audience: kubecoder-api
  timeout: 10s
log:
  level: info
  format: json
